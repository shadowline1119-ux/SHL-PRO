name: Build Windows Installer (SHL PRO)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Pobierz kod projektu
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skonfiguruj Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache zależności Rust (Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Zainstaluj zależności npm (z --legacy-peer-deps)
        run: npm install --legacy-peer-deps

      - name: Sprawdź typy TypeScript (tsc --noEmit)
        run: npm run lint

      - name: Zainstaluj Tauri CLI v2
        run: npm install --no-save --legacy-peer-deps @tauri-apps/cli@2

      - name: Wygeneruj ikony Windows (.ico) z logo SHL PRO
        run: npx tauri icon -o src-tauri/icons public/assets/aistudio/Metaliczny_znak_marki_SHL_PRO_cf0c8d3e.png

      - name: Skonfiguruj ikony w tauri.conf.json
        run: node scripts/prepare-tauri-icons.mjs

      - name: Zbuduj instalator Windows (.exe / .msi)
        run: npx tauri build

      - name: Wyślij gotowy instalator SHL PRO jako plik do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: SHL-PRO-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 90
